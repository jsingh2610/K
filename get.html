<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Get Kailasa</title>
<meta name="description" content="Shiva sadhana — japa mala, mantras, pooja & manifestation">
<meta property="og:title" content="Kailasa — Shiva Manifestation">
<meta property="og:description" content="Daily Shiva sadhana. Free on Google Play.">
<meta property="og:image" content="https://k-er2.pages.dev/icon-512.png">
<link rel="icon" href="/icon-192.png">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#0b0a12;color:#f3e9d2;font-family:system-ui,-apple-system,sans-serif;padding:24px;text-align:center}
  .card{max-width:360px;width:100%}
  img{width:96px;height:96px;border-radius:22px;margin-bottom:18px}
  h1{font-size:24px;margin-bottom:6px}
  p{opacity:.75;font-size:15px;line-height:1.5;margin-bottom:24px}
  .btn{display:block;width:100%;padding:16px;border-radius:14px;background:#d4a64a;color:#1a1204;
    font-weight:700;font-size:17px;text-decoration:none;margin-bottom:12px}
  .alt{display:block;color:#d4a64a;font-size:14px;text-decoration:underline;margin-top:8px}
  .note{font-size:13px;opacity:.6;margin-top:18px}
  .hide{display:none}
</style>
</head>
<body>
<div class="card">
  <img src="/icon-512.png" alt="Kailasa">
  <h1>Kailasa</h1>
  <p>Your daily Shiva sadhana — japa mala, pooja, mantras &amp; the 40-day path.</p>

  <a id="go" class="btn" href="#">Install from Google Play</a>
  <a id="web" class="alt" href="#">Open Play Store page instead</a>

  <div id="ios" class="note hide">Kailasa is on Android for now. iPhone version coming soon. Har Har Mahadev 🙏</div>
  <div id="ig" class="note hide">Not opening? Tap ⋮ (top right) → <b>Open in browser</b>.</div>
</div>

<script>
  var PKG = 'dev.pages.k_ejr2.twa';
  var WEB = 'https://play.google.com/store/apps/details?id=' + PKG;
  var INTENT = 'intent://details?id=' + PKG +
    '#Intent;scheme=market;package=com.android.vending;S.browser_fallback_url=' +
    encodeURIComponent(WEB) + ';end';

  var ua = navigator.userAgent || '';
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua);
  var inApp = /Instagram|FBAN|FBAV|FB_IAB|Threads/i.test(ua);

  var go = document.getElementById('go');
  document.getElementById('web').href = WEB;
  go.href = isAndroid ? INTENT : WEB;

  if (isIOS) document.getElementById('ios').classList.remove('hide');
  if (inApp) document.getElementById('ig').classList.remove('hide');

  // Auto-launch Play Store app on Android (button stays as backup if the in-app browser blocks it)
  if (isAndroid) setTimeout(function(){ location.href = INTENT; }, 300);
  else if (!isIOS) setTimeout(function(){ location.href = WEB; }, 300);
</script>
</body>
</html>
