name: Build Kailasa AAB


on:
  workflow_dispatch:
  push:
    paths:
      - 'twa/**'


jobs:
  build:
    runs-on: ubuntu-latest


    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'


      - name: Decode keystore
        working-directory: twa
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > signing.keystore


      - name: Download icons from live site
        run: |
          for dpi in xxxhdpi xxhdpi xhdpi hdpi mdpi; do
            mkdir -p twa/app/src/main/res/mipmap-$dpi
          done
          curl -sf -o twa/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png https://k-er2.pages.dev/icon-512.png
          curl -sf -o twa/app/src/main/res/mipmap-xxhdpi/ic_launcher.png https://k-er2.pages.dev/icon-192.png
          cp twa/app/src/main/res/mipmap-xxhdpi/ic_launcher.png twa/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp twa/app/src/main/res/mipmap-xxhdpi/ic_launcher.png twa/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp twa/app/src/main/res/mipmap-xxhdpi/ic_launcher.png twa/app/src/main/res/mipmap-mdpi/ic_launcher.png


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.13'


      - name: Build release AAB
        working-directory: twa
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:bundleRelease


      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: kailasa-aab-rerelease
          path: twa/app/build/outputs/bundle/release/app-release.aab
